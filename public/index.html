<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏大厅</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header id="appHeader">
            <h1>游戏大厅</h1>
            <div id="playerCount">在线: 0</div>
        </header>

        <div id="lobbyView">
            <div id="inviteLink" class="panel invite-panel">
                <div class="invite-copy">
                    邀请链接: <span id="ipDisplay">获取中...</span>
                </div>
            </div>

            <div class="panel">
                <div class="row">
                    <input type="text" id="nameInput" placeholder="输入你的名字" maxlength="8">
                    <button id="setNameBtn">改名</button>
                </div>
            </div>

            <div id="currentRoomPanel" class="panel current-room-panel" style="display:none;">
                <h3>当前房间</h3>
                <div id="currentRoomInfo" class="current-room-info"></div>
                <div id="currentRoomPlayers" class="current-room-players"></div>
                <div class="row current-room-actions">
                    <button id="lobbyStartGameBtn" type="button" style="display:none;">开始游戏</button>
                    <button id="lobbyLeaveRoomBtn" class="secondary" type="button">离开房间</button>
                </div>
            </div>

            <div class="panel">
                <h3>创建房间</h3>
                <div class="row">
                    <select id="gameTypeSelect"></select>
                    <button id="createRoomBtn">创建</button>
                </div>
            </div>

            <div class="panel">
                <h3>房间列表</h3>
                <div id="roomList">
                    <div class="empty">暂无房间</div>
                </div>
            </div>
        </div>

        <div id="roomView" style="display:none;">
            <div class="room-page-header">
                <button id="leaveRoomBtn" class="secondary" type="button">← 离开房间</button>
                <button id="startGameBtn" style="display:none;" type="button">开始游戏</button>
            </div>
            <div id="roomMount"></div>
            <div id="gameMount" style="display:none;"></div>
        </div>

        <div class="panel message-panel">
            <h3>消息</h3>
            <div id="log"></div>
            <div class="row">
                <input type="text" id="chatInput" placeholder="输入消息..." maxlength="50">
                <button id="sendChatBtn">发送</button>
            </div>
        </div>

        <div id="status">连接中...</div>
    </div>
    <script type="module" src="script.js?v=20260717-fix-black"></script>
</body>
</html>
