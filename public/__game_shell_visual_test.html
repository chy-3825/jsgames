    <style>
        .shell-test-metrics {
            position: fixed;
            z-index: 20000;
            right: max(8px, env(safe-area-inset-right));
            bottom: max(8px, env(safe-area-inset-bottom));
            max-width: calc(100vw - 16px);
            padding: 7px 9px;
            border: 1px solid rgba(255,255,255,.3);
            border-radius: 8px;
            background: rgba(3, 12, 16, .9);
            color: #d8e4df;
            font: 10px/1.45 ui-monospace, monospace;
            pointer-events: none;
        }
        .shell-test-metrics.is-failed { border-color: #e7796c; color: #ffc2b8; }

<body class="is-game-view">
    <div id="app">
        <section id="roomView" class="room-view" style="display:block">
            <header class="room-page-header" aria-label="游戏房间导航">
                <button id="leaveRoomBtn" class="back-button" type="button" aria-label="离开本局并回到大厅"><span aria-hidden="true">←</span><span>回到大厅</span></button>
                <div class="room-page-title"><span id="roomPageGame">移动端外壳验收</span></div>
                <div class="room-page-actions"><button id="startGameBtn" class="primary-button" style="display:none" type="button">开始游戏</button><button class="room-info-button" type="button" aria-label="房间信息"><span aria-hidden="true">ⓘ</span><b>房间信息</b></button></div>
            </header>
            <div id="gameMount" style="display:block"></div>
        </section>
    </div>
    <output id="shellTestMetrics" class="shell-test-metrics">正在加载…</output>
    <script type="module">
        const params = new URLSearchParams(location.search);
        const type = params.get('game') || 'loveletter';
        const title = type.replace(/(^|[-_])(\w)/g, (_, prefix, letter) => letter.toUpperCase());
        const mount = document.getElementById('gameMount');
        const metrics = document.getElementById('shellTestMetrics');
        const runtimeErrors = [];
        window.__shellTestRuntimeErrors = runtimeErrors;
        window.addEventListener('error', event => runtimeErrors.push(event.message || 'JavaScript error'));
        window.addEventListener('unhandledrejection', event => runtimeErrors.push(String(event.reason?.message || event.reason || 'Unhandled rejection')));
        mount.dataset.gameType = type;
        document.getElementById('roomPageGame').textContent = `${title} · 手机端验收`;

        import { fixtureState } from '/visual-fixtures/fixture-state.js?v=20260828-fixture-state-1';
        import { applyFixtureScenario } from '/visual-fixtures/fixture-scenarios.js?v=20260828-fixture-scenarios-1';

        async function waitForVisualAssets() {
            const pendingStyles = [...document.querySelectorAll('link[rel="stylesheet"]')].filter(link => !link.sheet);
            await Promise.all(pendingStyles.map(link => new Promise(resolve => {
                let settled = false;
                const done = () => { if (!settled) { settled = true; resolve(); } };
                link.addEventListener('load', done, { once: true });
                link.addEventListener('error', done, { once: true });
                if (link.sheet) done();
                else setTimeout(done, 500);
            })));
            await document.fonts.ready;
            await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        }

        try {
            const clientPath = type === 'chess' ? '/games/chess/lobby-client.js' : `/games/${type}/client.js`;
            const module = await import(`${clientPath}?v=20260901-code-health-1`);
            window.shellTestClient = module.createGameClient({ mount, send() {}, addLog() {} });
            const state = fixtureState(type);
            await applyFixtureScenario({ type, state, params, mount, client: window.shellTestClient });
            window.dispatchEvent(new Event('resize'));
            await new Promise(resolve => requestAnimationFrame(resolve));
            // Firefox's command-line screenshot mode captures after the
            // module has rendered but does not wait for an arbitrary Promise
            // continuation. Keep the regular font/layout settle for manual
            // inspection, while allowing the screenshot runner to reach the
            // metrics in the same task as the fixture render.
            if (params.get('screenshot') !== '1') await waitForVisualAssets();
            const viewportWidth = document.documentElement.clientWidth;
            const viewportHeight = document.documentElement.clientHeight;
            const scrollWidth = Math.max(document.documentElement.scrollWidth, document.body.scrollWidth);
            const scrollHeight = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
            const visibleLeaves = [...document.querySelectorAll('#leaveRoomBtn, [data-ui="leave"], [data-action="leave-room"]')]
                .filter(element => getComputedStyle(element).display !== 'none').length;
            const headerHeight = Math.round(document.querySelector('.room-page-header').getBoundingClientRect().height);
            const board = mount.querySelector('.jungle-board-wrap, .flight-board-wrap, .gobang-board-wrap, .checkers-board-wrap');
            const coreAction = mount.querySelector('.jungle-hint, .flight-command, .gobang-hint, .checkers-hint');
            const optionalAction = mount.querySelector('.checkers-end-move:not([hidden])');
            const boardRect = board?.getBoundingClientRect();
            const actionRect = coreAction?.getBoundingClientRect();
            const optionalActionRect = optionalAction?.getBoundingClientRect();
            const shortLandscape = viewportWidth > viewportHeight && viewportHeight <= 520;
            const coupFixtureState = params.get('coupState') || 'turn';
            const hanabiFixtureState = params.get('hanabiState') || 'hand';
            const cardCoreSelectors = {
                loveletter: ['.ll-opponents', '.ll-hand', '.ll-action-panel'],
                guessnumber: ['.gn-secret-zone', '.gn-input-slots', '.gn-keypad'],
                coup: ['.cp-council', '.cp-private', '.cp-action-console'],
                takefive: ['.tf-board', '.tf-hand-panel'],
                monopolydeal: ['.deal-hand', '.deal-command', '.deal-action-console', '.deal-command-body'],
                hanabi: ['.hb-command-panel', '.hb-teammates-section', '.hb-my-hand', '.hb-hand-action-bar'],
                splendor: ['.sp-market-stage', '.sp-command-panel'],
                kingdomino: ['.kd-command-column', '.kd-kingdom-stage'],
                acquire: ['.acquire-command', '.acquire-stage'],
                citadels: ['.citadels-command', '.citadels-stage'],
                lasvegas: ['.lv-command', '.lv-casinos'],
                scout: ['.sc-show-board', '.sc-hand-panel', '.sc-command'],
                manila: ['.mn-status', '.mn-routes', '.mn-command'],
                modernart: ['.art-status', '.art-auction', '.art-hand'],
                camelup: ['.cm-status', '.cm-track', '.cm-command'],
                magicalathlete: ['.ma-status', '.ma-race', '.ma-command'],
                werewolf: ['.ww-role', '.ww-action'],
                avalon: ['.av-mission-board', '.av-action-panel', '.av-private-action'],
                decrypto: ['.dc-status', '.dc-signal-grid', '.dc-command'],
                witchtown: ['.witchtown-command', '.witchtown-table-panel', '.witchtown-role-panel', '.witchtown-private-panel'],
            };
            if (type === 'coup' && coupFixtureState === 'challenge') cardCoreSelectors.coup = ['.cp-council', '.cp-stage', '.cp-challenge'];
            if (type === 'coup' && coupFixtureState === 'loss') cardCoreSelectors.coup = ['.cp-council', '.cp-loss-panel'];
            if (type === 'coup' && coupFixtureState === 'exchange') cardCoreSelectors.coup = ['.cp-exchange-dialog'];
            if (type === 'hanabi' && ['clue-color', 'clue-value'].includes(hanabiFixtureState)) cardCoreSelectors.hanabi = ['.hb-teammates-section', '.hb-command-panel'];
            if (type === 'hanabi' && hanabiFixtureState === 'presentation') cardCoreSelectors.hanabi = ['.hb-presentation-layer', '.hb-presentation-skip'];
            if (type === 'hanabi' && hanabiFixtureState === 'ended') cardCoreSelectors.hanabi = ['.hb-command-panel', '.hb-teammates-section', '.hb-my-hand'];
            const cardCore = (cardCoreSelectors[type] || []).map(selector => mount.querySelector(selector)).filter(Boolean);
            const cardCoreFits = cardCore.length === (cardCoreSelectors[type] || []).length && cardCore.every(element => {
                const rect = element.getBoundingClientRect();
                return rect.left >= -2 && rect.right <= viewportWidth + 2 && rect.top >= headerHeight - 2 && rect.bottom <= viewportHeight + 2;
            });
            const dealCard = type === 'monopolydeal' ? mount.querySelector('.deal-event .deal-preview-card, .deal-event .deal-main-public-card') : null;
            const dealCopy = type === 'monopolydeal' ? mount.querySelector('.deal-event .deal-preview-copy, .deal-event .deal-public-copy') : null;
            const dealCore = type === 'monopolydeal' ? mount.querySelector('.deal-stage-core') : null;
            const dealSupply = type === 'monopolydeal' ? mount.querySelector('.deal-supply') : null;
            const dealStageRect = type === 'monopolydeal' ? mount.querySelector('.deal-event')?.getBoundingClientRect() : null;
            const dealCoreRect = dealCore?.getBoundingClientRect();
            const dealSupplyRect = dealSupply?.getBoundingClientRect();
            const dealCentralAlignment = !dealCard || !dealCopy || !dealStageRect
                || !dealCoreRect || !dealSupplyRect || dealCoreRect.width === 0 || dealStageRect.width === 0
                || (() => {
                    const coreStyle = getComputedStyle(dealCore);
                    const gap = parseFloat(coreStyle.columnGap) || 0;
                    const borderRight = parseFloat(coreStyle.borderRightWidth) || 0;
                    const paddingRight = parseFloat(coreStyle.paddingRight) || 0;
                    const cardRect = dealCard.getBoundingClientRect();
                    const copyRect = dealCopy.getBoundingClientRect();
                    const expectedLeft = dealSupplyRect.right + gap;
                    const expectedRight = dealCoreRect.right - borderRight - paddingRight;
                    return Math.abs(dealStageRect.left - expectedLeft) <= 2
                        && Math.abs(dealStageRect.right - expectedRight) <= 2
                        && cardRect.left >= dealStageRect.left - 2
                        && copyRect.left - cardRect.right <= 14;
                })();
            const boardCoreFits = Boolean(boardRect && actionRect && boardRect.left >= -1 && boardRect.right <= viewportWidth + 1 && boardRect.top >= headerHeight - 1 && boardRect.bottom <= viewportHeight + 1 && actionRect.bottom <= viewportHeight + 1 && (!optionalActionRect || optionalActionRect.bottom <= viewportHeight + 1));
            const coreFits = board ? boardCoreFits : cardCoreFits;
            const landscapeHeightFits = !shortLandscape || type === 'coup' || scrollHeight <= viewportHeight + 1;
            const witchPortraits = type === 'witchtown' ? [...mount.querySelectorAll('.witchtown-seat-portrait, .witchtown-hall-art')] : [];
            const witchImageRatiosValid = witchPortraits.every(element => { const rect = element.getBoundingClientRect(); return Math.abs(rect.width - rect.height) <= 1; });
            const witchPublicFieldsVisible = type !== 'witchtown' || !shortLandscape || ['.witchtown-public-trials', '.witchtown-accusation-line', '.witchtown-public-cards'].every(selector => [...mount.querySelectorAll(selector)].every(element => getComputedStyle(element).display !== 'none'));
            const roleFocus = ['werewolf', 'avalon', 'witchtown'].includes(type) ? mount.querySelector('.social-role-focus') : null;
            const roleArt = type === 'avalon' ? mount.querySelector('.av-role-art img') : type === 'werewolf' ? mount.querySelector('.ww-role-art img') : type === 'witchtown' ? mount.querySelector('.witchtown-hall-art') : null;
            const roleFocusVisible = !roleFocus || getComputedStyle(roleFocus).display !== 'none' && roleFocus.getBoundingClientRect().width >= (shortLandscape ? 90 : 1) && roleFocus.getBoundingClientRect().height >= (shortLandscape ? 70 : 1);
            const roleArtDeferred = params.get('screenshot') === '1' && roleArt?.tagName === 'IMG' && !roleArt.complete;
            const roleArtReady = !roleArt || roleArt.tagName !== 'IMG' || roleArt.complete && roleArt.naturalWidth > 0 || roleArtDeferred;
            const coupScenario = type === 'coup' ? params.get('coupState') || 'turn' : '';
            const coupScenarioTargets = {
                challenge: ['.cp-challenge .cp-danger', '.cp-challenge .cp-secondary'],
                loss: ['.cp-loss-cards [data-loss-index]'],
                exchange: ['.cp-exchange-dialog'],
            };
            const coupScenarioElements = (coupScenarioTargets[coupScenario] || []).map(selector => mount.querySelector(selector)).filter(Boolean);
            const coupScenarioFits = type !== 'coup' || !coupScenarioTargets[coupScenario] || coupScenarioElements.length === coupScenarioTargets[coupScenario].length && coupScenarioElements.every(element => {
                const rect = element.getBoundingClientRect();
                return rect.left >= -2 && rect.right <= viewportWidth + 2 && rect.top >= headerHeight - 2 && rect.bottom <= viewportHeight + 2;
            });
            const passed = scrollWidth <= viewportWidth && landscapeHeightFits && visibleLeaves === 1 && headerHeight >= 44 && headerHeight <= 64 && (!shortLandscape || coreFits) && coupScenarioFits && witchImageRatiosValid && witchPublicFieldsVisible && roleFocusVisible && roleArtReady && dealCentralAlignment && runtimeErrors.length === 0;
            const boardSize = boardRect ? `${Math.round(boardRect.width)}×${Math.round(boardRect.height)}` : 'missing';
            const coreLabel = shortLandscape ? (coreFits ? 'fit' : 'clipped') : 'portrait-only';
            const diagnostic = params.get('debug') === '1'
                ? ` · ${[mount.firstElementChild, ...cardCore, ...mount.querySelectorAll('.witchtown-shell,.witchtown-workspace')].filter(Boolean).map(element => { const rect = element.getBoundingClientRect(); return `${element.className.split(' ')[0]}:${Math.round(rect.left)}-${Math.round(rect.right)}×${Math.round(rect.top)}-${Math.round(rect.bottom)}`; }).join(',')}`
                : '';
            metrics.textContent = `${passed ? 'PASS' : 'FAIL'} · ${type}${coupScenario ? `:${coupScenario}` : ''} · ${viewportWidth}×${viewportHeight} · scroll ${scrollWidth}×${scrollHeight}px · board ${boardSize} · core ${coreLabel} · central ${dealCentralAlignment ? 'aligned' : 'drifted'} · scenario ${coupScenarioFits ? 'fit' : 'clipped'} · art ${roleArtDeferred ? 'deferred' : witchImageRatiosValid && roleArtReady ? 'ready' : 'invalid'} · role ${roleFocusVisible ? 'visible' : 'hidden'} · public ${witchPublicFieldsVisible ? 'visible' : 'hidden'} · exits ${visibleLeaves}${diagnostic}`;
            metrics.classList.toggle('is-failed', !passed);
            document.documentElement.dataset.shellTest = passed ? 'passed' : 'failed';
        } catch (error) {
            metrics.textContent = `FAIL · ${type} · ${error.message}`;
            metrics.classList.add('is-failed');
            document.documentElement.dataset.shellTest = 'failed';
        }
    </script>
