        async function waitForVisualAssets() {
            const pendingStyles = [...document.querySelectorAll('link[rel="stylesheet"]')].filter(link => !link.sheet);
            await Promise.all(pendingStyles.map(link => new Promise(resolve => {
                let settled = false;
                const done = () => { if (!settled) { settled = true; resolve(); } };
                link.addEventListener('load', done, { once: true });
                link.addEventListener('error', done, { once: true });
                if (link.sheet) done();
                else setTimeout(done, 500);
            })));
            await document.fonts.ready;
            await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        }

        try {
            const clientPath = type === 'chess' ? '/games/chess/lobby-client.js' : `/games/${type}/client.js`;
            const module = await import(`${clientPath}?v=20260827-hidden-role-focus-1`);
            window.shellTestClient = module.createGameClient({ mount, send() {}, addLog() {} });
            const state = fixtureState(type);
            window.__shellTestState = state ? JSON.parse(JSON.stringify(state)) : null;
            if (state) window.shellTestClient.handleMessage({ type: 'gameState', state });
            if (type === 'loveletter') mount.querySelector('[data-card-index="0"]')?.click();
            if (type === 'monopolydeal') mount.querySelector('[data-card-index="0"]')?.click();
            if (type === 'hanabi') mount.querySelector('[data-hand-card-id]')?.click();
            if (params.get('rules') === '1') {
                mount.querySelector('[data-ui="rules"], [data-action="rules"], [data-action="roles"]')?.click();
            }
            if (params.get('revealRole') === '1') {
                const roleCover = mount.querySelector('[data-role-hold]');
                roleCover?.focus({ preventScroll: true });
                roleCover?.dispatchEvent(new KeyboardEvent('keydown', { key: ' ', bubbles: true }));
                // Keep the visual-fixture frame open after the synthetic hold;
                // real clients still use press-and-hold and hide on keyup.
                roleCover?.style.setProperty('display', 'none');
                roleCover?.closest('.social-role-focus')?.classList.add('is-revealed');
                roleCover?.parentElement.querySelector('[data-role-secret]')?.setAttribute('aria-hidden', 'false');
            }
            // Firefox's command-line screenshot mode captures after the
            // module has rendered but does not wait for an arbitrary Promise
            // continuation. Keep the regular font/layout settle for manual
            // inspection, while allowing the screenshot runner to reach the
            // metrics in the same task as the fixture render.
            if (params.get('screenshot') !== '1') await waitForVisualAssets();
            const viewportWidth = document.documentElement.clientWidth;
            const viewportHeight = document.documentElement.clientHeight;
            const scrollWidth = Math.max(document.documentElement.scrollWidth, document.body.scrollWidth);
            const scrollHeight = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
            const visibleLeaves = [...document.querySelectorAll('#leaveRoomBtn, [data-ui="leave"], [data-action="leave-room"]')]
                .filter(element => getComputedStyle(element).display !== 'none').length;
            const headerHeight = Math.round(document.querySelector('.room-page-header').getBoundingClientRect().height);
            const board = mount.querySelector('.jungle-board-wrap, .flight-board-wrap, .gobang-board-wrap, .checkers-board-wrap');
            const coreAction = mount.querySelector('.jungle-hint, .flight-command, .gobang-hint, .checkers-hint');
            const optionalAction = mount.querySelector('.checkers-end-move:not([hidden])');
            const boardRect = board?.getBoundingClientRect();
            const actionRect = coreAction?.getBoundingClientRect();
            const optionalActionRect = optionalAction?.getBoundingClientRect();
            const shortLandscape = viewportWidth > viewportHeight && viewportHeight <= 520;
            const cardCoreSelectors = {
                loveletter: ['.ll-opponents', '.ll-hand', '.ll-action-panel'],
                coup: ['.cp-council', '.cp-private', '.cp-action-console'],
                monopolydeal: ['.deal-hand', '.deal-command'],
                hanabi: ['.hb-command-panel', '.hb-teammates-section', '.hb-my-hand', '.hb-hand-action-bar'],
                werewolf: ['.ww-role', '.ww-action'],
                avalon: ['.av-status', '.av-mission-board', '.av-private-action'],
                decrypto: ['.dc-status', '.dc-signal-grid', '.dc-command'],
                witchtown: ['.witchtown-command', '.witchtown-table-panel', '.witchtown-role-panel', '.witchtown-private-panel'],
            };
            const cardCore = (cardCoreSelectors[type] || []).map(selector => mount.querySelector(selector)).filter(Boolean);
            const cardCoreFits = cardCore.length === (cardCoreSelectors[type] || []).length && cardCore.every(element => {
                const rect = element.getBoundingClientRect();
                return rect.left >= -1 && rect.right <= viewportWidth + 1 && rect.top >= headerHeight - 1 && rect.bottom <= viewportHeight + 1;
            });
            const boardCoreFits = Boolean(boardRect && actionRect && boardRect.left >= -1 && boardRect.right <= viewportWidth + 1 && boardRect.top >= headerHeight - 1 && boardRect.bottom <= viewportHeight + 1 && actionRect.bottom <= viewportHeight + 1 && (!optionalActionRect || optionalActionRect.bottom <= viewportHeight + 1));
            const coreFits = board ? boardCoreFits : cardCoreFits;
            const landscapeHeightFits = !shortLandscape || scrollHeight <= viewportHeight + 1;
            const witchPortraits = type === 'witchtown' ? [...mount.querySelectorAll('.witchtown-seat-portrait, .witchtown-hall-art')] : [];
            const witchImageRatiosValid = witchPortraits.every(element => { const rect = element.getBoundingClientRect(); return Math.abs(rect.width - rect.height) <= 1; });
            const witchPublicFieldsVisible = type !== 'witchtown' || !shortLandscape || ['.witchtown-public-trials', '.witchtown-accusation-line', '.witchtown-public-cards'].every(selector => [...mount.querySelectorAll(selector)].every(element => getComputedStyle(element).display !== 'none'));
            const roleFocus = ['werewolf', 'avalon', 'witchtown'].includes(type) ? mount.querySelector('.social-role-focus') : null;
            const roleArt = type === 'avalon' ? mount.querySelector('.av-role-art img') : type === 'werewolf' ? mount.querySelector('.ww-role-art img') : type === 'witchtown' ? mount.querySelector('.witchtown-hall-art') : null;
            const roleFocusVisible = !roleFocus || getComputedStyle(roleFocus).display !== 'none' && roleFocus.getBoundingClientRect().width >= (shortLandscape ? 90 : 1) && roleFocus.getBoundingClientRect().height >= (shortLandscape ? 70 : 1);
            const roleArtDeferred = params.get('screenshot') === '1' && roleArt?.tagName === 'IMG' && !roleArt.complete;
            const roleArtReady = !roleArt || roleArt.tagName !== 'IMG' || roleArt.complete && roleArt.naturalWidth > 0 || roleArtDeferred;
            const passed = scrollWidth <= viewportWidth && landscapeHeightFits && visibleLeaves === 1 && headerHeight >= 44 && headerHeight <= 64 && (!shortLandscape || coreFits) && witchImageRatiosValid && witchPublicFieldsVisible && roleFocusVisible && roleArtReady && runtimeErrors.length === 0;
            const boardSize = boardRect ? `${Math.round(boardRect.width)}×${Math.round(boardRect.height)}` : 'missing';
            const coreLabel = shortLandscape ? (coreFits ? 'fit' : 'clipped') : 'portrait-only';
            const diagnostic = params.get('debug') === '1'
                ? ` · ${[mount.firstElementChild, ...cardCore, ...mount.querySelectorAll('.witchtown-shell,.witchtown-workspace')].filter(Boolean).map(element => { const rect = element.getBoundingClientRect(); return `${element.className.split(' ')[0]}:${Math.round(rect.left)}-${Math.round(rect.right)}×${Math.round(rect.top)}-${Math.round(rect.bottom)}`; }).join(',')}`
                : '';
            metrics.textContent = `${passed ? 'PASS' : 'FAIL'} · ${type} · ${viewportWidth}×${viewportHeight} · scroll ${scrollWidth}×${scrollHeight}px · board ${boardSize} · core ${coreLabel} · art ${roleArtDeferred ? 'deferred' : witchImageRatiosValid && roleArtReady ? 'ready' : 'invalid'} · role ${roleFocusVisible ? 'visible' : 'hidden'} · public ${witchPublicFieldsVisible ? 'visible' : 'hidden'} · exits ${visibleLeaves}${diagnostic}`;
            metrics.classList.toggle('is-failed', !passed);
            document.documentElement.dataset.shellTest = passed ? 'passed' : 'failed';
        } catch (error) {
            metrics.textContent = `FAIL · ${type} · ${error.message}`;
            metrics.classList.add('is-failed');
            document.documentElement.dataset.shellTest = 'failed';
        }
    </script>
</body>
</html>
