<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>大富翁纸牌地产逐张检查</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#181818}body{display:grid;place-items:center}.shot{width:300px;height:440px}.shot>.deal-card{position:relative;display:block;width:300px;height:440px;margin:0;overflow:hidden;border:0;border-radius:8px;background:#f6f4eb}.deal-source-property{display:block;width:100%;height:100%}.deal-card>*{position:absolute;inset:0;width:100%;height:100%}</style></head><body><main class="shot" id="shot"></main>
<script type="module">import { publicCardMarkup } from '/games/monopolydeal/cards.js';const cards=await fetch('./cards.json').then(r=>r.json());const i=Math.max(0,Math.min(cards.length-1,Number(new URLSearchParams(location.search).get('i'))||0));document.title=`${i+1}_${cards[i].name}`;document.querySelector('#shot').innerHTML=publicCardMarkup(cards[i]);document.documentElement.dataset.ready='true';</script></body></html>
