<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>侍卫卡面包边试样</title>
<style>
  * { box-sizing: border-box; }
  body { min-height: 100vh; margin: 0; padding: 36px; background: #28150f; color: #f1e5cf; font-family: serif; }
  main { display: flex; flex-wrap: wrap; align-items: end; justify-content: center; gap: 56px; min-height: calc(100vh - 72px); padding: 40px; border-radius: 18px; background: radial-gradient(circle at 50% 35%, #743444, #672c3a 48%, #3d1823); }
  figure { display: grid; justify-items: center; gap: 12px; margin: 0; }
  img { display: block; width: 154px; height: auto; filter: drop-shadow(0 12px 22px rgba(0,0,0,.38)); }
  .large img { width: 280px; }
  figcaption { color: #d8c5a5; font-size: 14px; }
</style>
<main>
  <figure><img src="guard.png" alt="侍卫卡面，小尺寸"><figcaption>手牌区约 154px</figcaption></figure>
  <figure class="large"><img src="guard.png" alt="侍卫卡面，大尺寸"><figcaption>放大检查</figcaption></figure>
</main>
</html>
